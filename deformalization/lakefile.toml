name = "groupoidCorr"
defaultTargets = ["GroupoidCorr"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib release matching lean-toolchain (v4.36.0).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "GroupoidCorr"

# `lake comparator` (see comparator.json): Challenge = the library's statements with all proofs
# `sorry` (generated by scripts/make_challenge.py); Solution = the library.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
